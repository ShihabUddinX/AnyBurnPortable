[Launch]
ProgramExecutable=AnyBurn32\AnyBurn.exe
ProgramExecutable64=AnyBurn\AnyBurn.exe
ProgramExecutableARM64=AnyBurnARM64\AnyBurn.exe
ProgramExecutableWhenParameters=AnyBurn32\abcmd.exe
ProgramExecutableWhenParameters64=AnyBurn\abcmd.exe
ProgramExecutableWhenParametersARM64=AnyBurnARM64\abcmd.exe
MinOS=2000
DirectoryMoveOK=yes
SupportsUNC=yes

[FileWrite1]
Type=INI
File=%PAL:DataDir%\settings\anyburn.ini
Section=Settings
Key=PortableVersion
Value=1

[FileWrite2]
Type=INI
File=%PAL:DataDir%\settings\anyburn.ini
Section=Settings
Key=Language
Value=%PAL:LanguageCustom%

[Language]
Base=%PortableApps.comLocaleID%
;CheckIfExists=%FullAppDir%\Lang\%PortableApps.comLocaleName%.ini
DefaultIfNotExists=1033

[LanguageStrings]
1025=11265

[FilesMove]
settings\anyburn.ini=%FullAppDir%