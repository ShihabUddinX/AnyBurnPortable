[Launch]
ProgramExecutable=AnyBurnPro32\AnyBurnPro.exe
ProgramExecutable64=AnyBurnPro\AnyBurnPro.exe
ProgramExecutableARM64=AnyBurnProARM64\AnyBurnPro.exe
ProgramExecutableWhenParameters=AnyBurnPro32\abcmd.exe
ProgramExecutableWhenParameters64=AnyBurnPro\abcmd.exe
ProgramExecutableWhenParametersARM64=AnyBurnProARM64\abcmd.exe
MinOS=2000
DirectoryMoveOK=yes
SupportsUNC=yes

[FileWrite1]
Type=INI
File=%PAL:DataDir%\settings\anyburn.ini
Section=Settings
Key=PortableVersion
Value=1

[FileWrite2]
Type=INI
File=%PAL:DataDir%\settings\anyburn.ini
Section=Settings
Key=Language
Value=%PAL:LanguageCustom%

[Language]
Base=%PortableApps.comLocaleID%
;CheckIfExists=%FullAppDir%\Lang\%PortableApps.comLocaleName%.ini
DefaultIfNotExists=1033

[LanguageStrings]
1025=11265

[FilesMove]
settings\anyburn.ini=%FullAppDir%